{% include base_path %}

<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="simple-nav" aria-label="Main navigation">
        <a class="site-brand" href="{{ base_path }}/">{{ site.title }}</a>
        <button id="nav-toggle" class="nav-toggle" type="button"
                aria-expanded="false" aria-controls="primary-navigation"
                aria-label="Toggle navigation">Menu</button>
        <ul id="primary-navigation" class="nav-links">
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
            {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li><a href="{{ domain }}{{ link.url }}">{{ link.title }}</a></li>
          {% endfor %}
          <li>
            <button id="theme-toggle" class="theme-toggle" type="button"
                    aria-label="Toggle dark mode" aria-pressed="false">
              <i id="theme-icon" class="fa-solid fa-sun" aria-hidden="true"></i>
            </button>
          </li>
        </ul>
      </nav>
    </div>
  </div>
</div>
